[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-intelligence-agent"
version = "0.1.0"
description = "Autonomous research agent that plans, searches, grounds and synthesises competitor briefs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Samiksha Batra" }]
dependencies = [
    "anthropic>=0.69",
    "google-genai>=1.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
dev = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
mia = "market_intelligence_agent.cli:main"
mia-web = "market_intelligence_agent.web.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Explicit rule set so a ruff upgrade cannot fail CI on rules the project never chose.
select = ["E", "F", "I", "B", "UP", "SIM", "RET"]

[tool.ruff.lint.per-file-ignores]
# Tests reach into private attributes on purpose to assert internal state.
"tests/*" = ["SLF001"]
