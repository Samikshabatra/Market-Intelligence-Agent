# 25-query evaluation set (spec section 7.1).
#
# Categories map to the five behaviours the set has to exercise:
#   comparison       - direct competitor comparisons
#   pricing          - pricing / positioning lookups
#   recent           - news, funding, product launches (recency-sensitive)
#   sparse           - ambiguous or thin-data queries; should trigger fallback and flags
#   conflicting      - queries where public sources are known to disagree
#
# `expect_flag: true` means the correct behaviour is an explicit low-confidence or
# conflicting flag, NOT a confident answer. The harness scores those queries on whether
# the agent declined to assert, which is how fallback precision is measured.

- id: q01
  category: comparison
  query: How does Notion position against Coda for mid-market knowledge management?
  focus_sections: [positioning, strengths, weaknesses]

- id: q02
  category: comparison
