name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src eval tests

      - name: Test
        run: pytest -q

      # The offline corpus needs no API keys, so the eval set runs on every push.
      # It gates groundedness, citation validity, flag recall and the per-stage
      # latency budgets; live latency numbers still require a real provider.
      - name: Evaluation suite (offline)
        env:
          MIA_MOCK_CORPUS: eval/fixtures/offline_corpus.json
        run: python eval/harness.py --offline
